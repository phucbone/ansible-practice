---
- name: Add cluster nodes to /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item }}"
    state: present
  loop: "{{ hosts_entries }}"
  register: hosts_file_result
  changed_when: hosts_file_result.changed

- name: Create group for Elasticsearch
  ansible.builtin.group:
    name: "{{ elasticsearch_group }}"
    state: present
  register: es_group_result
  changed_when: es_group_result.changed

- name: Create user for Elasticsearch
  ansible.builtin.user:
    name: "{{ elasticsearch_user }}"
    group: "{{ elasticsearch_group }}"
    shell: /bin/bash
    create_home: true
    append: true
  register: es_user_result
  changed_when: es_user_result.changed

- name: Add user to sudo group
  ansible.builtin.user:
    name: "{{ elasticsearch_user }}"
    groups: sudo
    append: true
  register: es_add_sudo_result
  changed_when: es_add_sudo_result.changed

- name: Create sudoers file for Elasticsearch
  ansible.builtin.copy:
    content: "{{ elasticsearch_user }} ALL=(ALL) NOPASSWD:ALL"
    dest: "/etc/sudoers.d/{{ elasticsearch_user }}"
    owner: root
    group: root
    mode: '0440'
  register: sudoers_result
  changed_when: sudoers_result.changed

- name: Create directories for Elasticsearch
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ elasticsearch_user }}"
    group: "{{ elasticsearch_group }}"
    mode: '0755'
  loop:
    - "{{ elasticsearch_home }}"
    - "{{ log_path }}"
    - "{{ config_path }}"
    - "{{ setup_path }}"
    - "{{ data_path }}"
  register: directories_result
  changed_when: directories_result.changed
